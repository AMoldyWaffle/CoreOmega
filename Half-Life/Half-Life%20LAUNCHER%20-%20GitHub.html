html,body{margin:0;width:100%;height:100%;background:#111;color:#eee;font-family:Arial,sans-serif;overflow:hidden}

.gameButton:disabled{opacity:.45;cursor:default}
#status{margin-top:14px;font-family:monospace;color:#aaa;white-space:pre-wrap}
#game{display:none;position:fixed;inset:0;width:100vw;height:100vh;align-items:center;justify-content:center;background:#000;z-index:9999;overflow:hidden}

canvas{max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:auto}
#console{position:absolute;left:0;right:0;bottom:0;max-height:35%;overflow:auto;background:#000d;color:#8f8;font:12px monospace;padding:8px;display:none;white-space:pre-wrap}
.small{font-size:12px;color:#777}

function base64ToArrayBuffer(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

var statusElement=document.getElementById('status');
var consoleElement=document.getElementById('console');
var canvas=document.getElementById('canvas');
var launcher=document.getElementById('launcher');
var game=document.getElementById('game');
var selectedZip=null;
var mfs=null;
var mounted=false;
var savedRun=null;
var moduleCount=0;
var gamedir='valve';
var ENV=[];

function log(s){
  if(s===undefined||s===null)return;
  consoleElement.textContent += String(s)+'\n';
  consoleElement.scrollTop=consoleElement.scrollHeight;
}
function setStatus(s){statusElement.textContent=s;log(s)}

var memoryRequest={status:0,response:base64ToArrayBuffer(MEM_B64),addEventListener:function(type,fn){if(type==='load')setTimeout(fn,0);}};

var Module={
  TOTAL_MEMORY:160*1024*1024,
  preRun:[],postRun:[],
  memoryInitializerRequest:memoryRequest,
  print:function(text){log(text)},
  printErr:function(text){log('[stderr] '+text)},
  canvas:canvas,
  setStatus:function(text){if(text)setStatus(text)},
  monitorRunDependencies:function(left){if(left)setStatus('Preparing engine… '+left)}
};

function haltRun(){}

function prepareEngine(){
  savedRun=run;
  Module.run=haltRun;
  run=haltRun;
  ENV.XASH3D_GAMEDIR=gamedir;
  ENV.XASH3D_RODIR='/rodir';
  setStatus('Xash3D core loaded. Loading game modules…');
  ['server','client','menu'].forEach(function(name){
    var s=document.createElement('script');
    s.onload=function(){
      moduleCount++;
      if(moduleCount===3){
        setStatus('Ready. Choose your Half-Life.');
        document.getElementById('launch').disabled=false;
      }
    };
    s.onerror=function(){setStatus('Could not load '+name+'.js')};
    s.src=name+'.js';
    document.body.appendChild(s);
  });
}
Module.preInit=[prepareEngine];

canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();alert('WebGL context was lost. Reload the HTML file.')});

var gameButtons=document.querySelectorAll('.gameButton');

var githubZipUrls={
  'uplink.zip':'https://raw.githubusercontent.com/AMoldyWaffle/CoreOmega/main/Half-Life/uplink.zip',
  'hldm.zip':'https://raw.githubusercontent.com/AMoldyWaffle/CoreOmega/main/Half-Life/hldm.zip',
  'dayone.zip':'https://raw.githubusercontent.com/AMoldyWaffle/CoreOmega/main/Half-Life/dayone.zip'
};

gameButtons.forEach(function(button){
  button.addEventListener('click',function(){
    if(button.disabled)return;

    gameButtons.forEach(function(b){b.classList.remove('selected')});
    button.classList.add('selected');

    var filename=button.getAttribute('data-file');
    var url=githubZipUrls[filename];
    var launchButton=document.getElementById('launch');

    selectedZip=null;
    launchButton.disabled=true;
    setStatus('Loading '+filename+'…');

    fetch(url)
      .then(function(response){
        if(!response.ok)throw new Error('GitHub returned HTTP '+response.status);
        return response.blob();
      })
      .then(function(blob){
        selectedZip=new File([blob],filename,{type:'application/zip'});
        launchButton.disabled=false;
        setStatus('Loaded: '+filename+' ('+Math.round(selectedZip.size/1048576)+' MiB). Ready to launch.');
      })
      .catch(function(e){
        selectedZip=null;
        gameButtons.forEach(function(b){b.classList.remove('selected')});
        launchButton.disabled=true;
        setStatus('Could not load '+filename+' '+e);
      });
  });
});

document.getElementById('launch').addEventListener('click',function(){
  if(!selectedZip)return;
  this.disabled=true;
  setStatus('Mounting game ZIP…');
  try{
    FS.mkdir('/rodir');
    FS.mkdir('/xash');
    mfs=new BrowserFS.FileSystem.MountableFileSystem();
    BrowserFS.initialize(mfs);
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var Buffer=BrowserFS.BFSRequire('buffer').Buffer;
        mfs.mount('/zip',new BrowserFS.FileSystem.ZipFS(Buffer.from(reader.result)));
        FS.mount(new BrowserFS.EmscriptenFS(),{root:'/zip'},'/rodir');
        mounted=true;
        FS.chdir('/xash/');
        Module.arguments=['-dev','1','-game','valve'];
        Module.run=savedRun;
        run=savedRun;
        launcher.style.display='none';
        game.style.display='flex';
        setStatus('Starting Half-Life…');

        var fullscreenPromise=null;
        if(game.requestFullscreen){
          try{ fullscreenPromise=game.requestFullscreen({navigationUI:'hide'}); }catch(e){ console.log('Fullscreen request unavailable:',e); }
        }
        if(fullscreenPromise && fullscreenPromise.catch)
          fullscreenPromise.catch(function(e){ console.log('Fullscreen was not granted:',e); });

        Module.run();
      }catch(e){setStatus('Could not mount/start the ZIP: '+e);document.getElementById('launch').disabled=false;}
    };
    reader.onerror=function(){setStatus('Could not read the ZIP file.');document.getElementById('launch').disabled=false;};
    reader.readAsArrayBuffer(selectedZip);
  }catch(e){setStatus('BrowserFS error: '+e);this.disabled=false;}
});
</script>
<script src="xash.js"></script>
</body>
