<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's Ultimate Custom Night</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        canvas {
            display: none;
            user-select: none;
        }

        .selection {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: monospace;
            text-align: center;
            font-weight: lighter;
            width: 60vw;
            max-width: 500px;
        }

        .loader h1 {
            margin: 0 0 1em 0;
            font-size: 2em;
            letter-spacing: 0.05em;
        }

        .loader .bar-track {
            width: 100%;
            height: 1.2em;
            border: 1px solid white;
            padding: 2px;
            box-sizing: border-box;
        }

        .loader .bar-fill {
            height: 100%;
            width: 0%;
            background-color: white;
            transition: width 0.15s linear;
        }

        .loader h2 {
            margin: 1em 0 0 0;
            font-size: 0.9em;
            font-weight: lighter;
        }
    </style>
</head>

<body>
    <canvas id="MMFCanvas" width="1280" height="720"> Your browser does not support Canvas, Please try again.</canvas>
    <div class="selection" id="selection">
        <div class="loader">
            <h1 id="percentage">0%</h1>
            <div class="bar-track">
                <div class="bar-fill" id="bar"></div>
            </div>
            <h2 id="stage">STARTING UP...</h2>
        </div>
    </div>
    
</body>
<!--Made by irv77-->
<!--Modified to launch directly from file:/// (no local server needed) by replacing
    the fetch()/XHR-based part downloading with <script> tag loading, since fetch and
    XMLHttpRequest are blocked by browsers when a page is opened via the file:// protocol,
    but <script src="..."> tags are not.-->
<script>
    const parts = 20;
    const REPO = "AMoldyWaffle/Five-Nights-at-Frebby";
    const FOLDER = "FNaF UCN";
    const ROOT_CDN = "https://cdn.jsdelivr.net/gh/" + REPO + "@main/" + FOLDER;
    const ROOT_RAW = "https://raw.githubusercontent.com/" + REPO + "/main/" + FOLDER;
    const runtimecanvas = "resources/UCNHTML5.cch";
    const gametitle = document.title;
    window.__FNAF_PARTS = window.__FNAF_PARTS || [];

    window.addEventListener("scroll", preventMotion, false);
    window.addEventListener("touchmove", preventMotion, false);
    function preventMotion(event) {
        window.scrollTo(0, 0);
        event.preventDefault();
        event.stopPropagation();
    }

    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', event => delete pressedKeys[event.key]);

    window.addEventListener("load", () => {
        const map = new Map();

        function updateProgress(text, percent) {
            percent = Math.max(0, Math.min(100, Math.floor(percent)));
            document.title = percent + '% ' + gametitle;
            document.getElementById('percentage').textContent = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').textContent = text;
        }

        async function fetchAndRunScript(url, label, timeout=60000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {cache:'force-cache', signal:controller.signal});
                if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
                const source = await response.text();
                if (!source || source.length < 20) throw new Error('empty script');

                // ChromeOS/Chromebook is much more reliable with HTTPS resources
                // fetched first and then executed from a local Blob URL than with
                // thousands-of-KB cross-origin <script src> requests from file://.
                const blob = new Blob([source], {type:'application/javascript'});
                const blobUrl = URL.createObjectURL(blob);
                try {
                    await new Promise((resolve, reject) => {
                        const s = document.createElement('script');
                        let finished = false;
                        const finish = (err) => {
                            if (finished) return;
                            finished = true;
                            s.remove();
                            err ? reject(err) : resolve();
                        };
                        s.onload = () => finish();
                        s.onerror = () => finish(new Error('execution error loading ' + label));
                        s.src = blobUrl;
                        document.head.appendChild(s);
                        setTimeout(() => finish(new Error('execution timeout for ' + label)), timeout);
                    });
                } finally {
                    URL.revokeObjectURL(blobUrl);
                }
            } finally {
                clearTimeout(timer);
            }
        }

        function mirrorUrls(path) {
            const folder = encodeURIComponent(FOLDER).replace(/%2F/g, '/');
            const cleanPath = folder + path;
            return [
                'https://media.githubusercontent.com/media/' + REPO + '/main/' + cleanPath,
                'https://rawcdn.githack.com/' + REPO + '/main/' + cleanPath,
                'https://cdn.githubraw.com/' + REPO + '/main/' + cleanPath,
                'https://gitcdn.link/cdn/' + REPO + '/main/' + cleanPath,
                'https://raw.githubusercontent.com/' + REPO + '/refs/heads/main/' + cleanPath,
                'https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + cleanPath,
                'https://fastly.jsdelivr.net/gh/' + REPO + '@main/' + cleanPath
            ];
        }

        async function loadWithFallback(urls, label) {
            let lastError = null;
            for (let i = 0; i < urls.length; i++) {
                try {
                    await fetchAndRunScript(urls[i], label + ' (source ' + (i + 1) + '/' + urls.length + ')', 60000);
                    return urls[i];
                } catch (e) {
                    lastError = e;
                    console.warn(label + ' source ' + (i + 1) + ' failed:', e);
                }
            }
            throw lastError || new Error('Failed to load ' + label);
        }

        async function loadRuntimeAndZip() {
            // Same loading pattern as the working Sister Location launcher:
            // JSZip is loaded from a normal HTTPS CDN, while the game runtime is
            // fetched and executed from a Blob URL.
            await new Promise((resolve, reject) => {
                if (window.JSZip) return resolve();
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('Failed to load JSZip'));
                document.head.appendChild(s);
            });
            await loadWithFallback(mirrorUrls('/src/Runtime.js'), 'Runtime.js');
        }

        function base64ToBytes(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        async function loadOnePart(i) {
            const n = i + 1;
            const label = 'src/data/part' + n + '.js';
            await loadWithFallback(mirrorUrls('/src/data/part' + n + '.js'), label);
            if (typeof window.__FNAF_PARTS[i] !== 'string') {
                throw new Error(label + ' loaded but did not create __FNAF_PARTS[' + i + ']');
            }
        }

        async function loadParts() {
            // Keep some concurrency so one flaky CDN request cannot break the whole batch.
            const concurrency = 2;
            let next = 0, completed = 0;
            const worker = async () => {
                while (true) {
                    const i = next++;
                    if (i >= parts) return;
                    let last;
                    for (let attempt = 1; attempt <= 6; attempt++) {
                        try {
                            await loadOnePart(i);
                            last = null;
                            break;
                        } catch (e) {
                            last = e;
                            if (attempt < 6) await new Promise(r => setTimeout(r, 1500 * attempt));
                        }
                    }
                    if (last) throw last;
                    completed++;
                    updateProgress('LOADING GAME DATA (' + completed + '/' + parts + ')...', completed / parts * 35);
                }
            };
            await Promise.all(Array.from({length: concurrency}, worker));

            const byteArrays = [];
            for (let i = 0; i < parts; i++) {
                updateProgress('ASSEMBLING DATA PART ' + (i + 1) + '/' + parts + '...', 35 + (i + 1) / parts * 15);
                byteArrays.push(base64ToBytes(window.__FNAF_PARTS[i]));
                window.__FNAF_PARTS[i] = null;
            }
            return new Blob(byteArrays, {type:'application/zip'});
        }

        async function extract(resourcesBlob) {
            const arrayBuffer = await resourcesBlob.arrayBuffer();
            updateProgress('READING ARCHIVE...', 55);
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            let extracted = 0;
            let nextFile = 0;
            const workers = Array.from({length: Math.min(4, files.length)}, async () => {
                while (true) {
                    const i = nextFile++;
                    if (i >= files.length) return;
                    const name = files[i];
                    const blob = await zip.files[name].async('blob');
                    map.set(name, URL.createObjectURL(blob));
                    extracted++;
                    updateProgress('UNPACKING ' + name.toUpperCase() + '...', 55 + (extracted / files.length) * 40);
                }
            });
            await Promise.all(workers);
        }

        function intercept() {
            const originalFetch = window.fetch;
            window.fetch = function(input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const name = input.split('/').pop();
                    if (map.has(name)) return originalFetch(map.get(name), init);
                }
                return originalFetch(input, init);
            };
            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                if (typeof url === 'string' && url.startsWith('resources/')) {
                    const name = url.split('/').pop();
                    if (map.has(name)) url = map.get(name);
                }
                return originalOpen.apply(this, arguments);
            };
            for (const Tag of [HTMLImageElement, HTMLAudioElement, HTMLVideoElement]) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) Object.defineProperty(Tag.prototype, 'src', {
                    configurable:true, enumerable:true, get:descriptor.get,
                    set:function(val) {
                        if (typeof val === 'string' && val.startsWith('resources/')) {
                            const name = val.split('/').pop();
                            if (map.has(name)) val = map.get(name);
                        }
                        descriptor.set.call(this, val);
                    }
                });
            }
        }

        async function start() {
            try {
                updateProgress('STARTING UP...', 0);
                updateProgress('DOWNLOADING GAME DATA...', 3);
                // Begin the engine files and the large game parts at the same time.
                const runtimePromise = loadRuntimeAndZip();
                const partsPromise = loadParts();
                await runtimePromise;
                const resourcesBlob = await partsPromise;
                await extract(resourcesBlob);
                intercept();
                updateProgress('STARTING ENGINE...', 98);
                document.getElementById('MMFCanvas').style.display = 'block';
                document.getElementById('selection').style.display = 'none';
                updateProgress('READY', 100);
                new Runtime('MMFCanvas', runtimecanvas);
            } catch (err) {
                console.error(err);
                document.getElementById('stage').textContent =
                    'ERROR: ' + (err && err.message ? err.message : 'FAILED TO LOAD GAME DATA');
            }
        }
        start();
    });
</script>
</html>
