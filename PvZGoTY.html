<script>
/*
 * Plants vs. Zombies WebAssembly launcher
 *
 * Files expected in this directory:
 *
 *   index.html
 *   pvz.js
 *   pvz.wasm
 *   main.pak.part1
 *   main.pak.part2
 *   main.pak.part3
 *   properties/
 *
 * The three main.pak pieces are concatenated directly into
 * /main.pak inside the Emscripten virtual filesystem.
 */

const PVZ_BASE =
    "https://cdn.jsdelivr.net/gh/AMoldyWaffle/PS2-HTML-ORYX@main/PvZ/";

const canvas = document.getElementById("canvas");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const statusText = document.getElementById("status");
const progress = document.getElementById("progress");

/*
 * Emscripten must see Module BEFORE pvz.js is loaded.
 */
let readyResolve;
let readyReject;

window.moduleReadyPromise = new Promise((resolve, reject) => {
    readyResolve = resolve;
    readyReject = reject;
});

var Module = {
    canvas: canvas,

    /*
     * Do not let Emscripten look for pvz.wasm relative to
     * index.html. Explicitly point it at the PvZ directory.
     */
    locateFile: function(path) {
        return PVZ_BASE + path;
    },

    noInitialRun: true,

    onRuntimeInitialized: function() {
        console.log("Emscripten runtime initialized.");
        readyResolve();
    },

    onAbort: function(reason) {
        console.error("Emscripten aborted:", reason);
        readyReject(
            new Error("Emscripten aborted: " + (reason || "unknown reason"))
        );
    },

    print: function(text) {
        console.log(text);
    },

    printErr: function(text) {
        console.warn(text);
    }
};


/*
 * Dynamically load pvz.js AFTER Module has been created.
 */
function loadPvzJS() {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = PVZ_BASE + "pvz.js";

        script.onload = resolve;

        script.onerror = function() {
            reject(new Error(
                "Could not load pvz.js from the PvZ directory."
            ));
        };

        document.body.appendChild(script);
    });
}


/*
 * Fetch a binary file.
 *
 * This uses the GitHub raw file URL rather than trying to make
 * the browser load the binary through the GitHub HTML page.
 */
async function fetchPart(filename, partNumber) {

    const url =
        "https://raw.githubusercontent.com/" +
        "AMoldyWaffle/PS2-HTML-ORYX/main/PvZ/" +
        filename;

    statusText.textContent =
        "Downloading " + filename + "...";

    const response = await fetch(url, {
        cache: "no-cache"
    });

    if (!response.ok) {
        throw new Error(
            filename +
            " failed to download (HTTP " +
            response.status +
            ")."
        );
    }

    const contentLength =
        Number(response.headers.get("content-length")) || 0;

    /*
     * If the server provides a content length, show a useful
     * per-part progress indicator.
     */
    if (contentLength > 0 && response.body) {

        const reader = response.body.getReader();

        const chunks = [];
        let received = 0;

        while (true) {

            const result = await reader.read();

            if (result.done)
                break;

            chunks.push(result.value);
            received += result.value.length;

            const percent =
                Math.round((received / contentLength) * 100);

            statusText.textContent =
                "Downloading " +
                filename +
                " — " +
                percent +
                "%";

            /*
             * Overall progress:
             *
             * part1 = 0-33
             * part2 = 33-66
             * part3 = 66-100
             */
            const overall =
                ((partNumber - 1) * 100 + percent) / 3;

            progress.value = overall;
        }

        const combined = new Uint8Array(received);

        let offset = 0;

        for (const chunk of chunks) {
            combined.set(chunk, offset);
            offset += chunk.length;
        }

        return combined;
    }

    return new Uint8Array(
        await response.arrayBuffer()
    );
}


/*
 * Make sure a directory exists in the Emscripten filesystem.
 */
function mkdirSafe(path) {

    try {
        Module.FS.mkdir(path);
    } catch (e) {
        /*
         * EEXIST is fine.
         */
    }
}


/*
 * Download part1, part2 and part3 and concatenate them
 * directly into /main.pak.
 *
 * This avoids:
 *
 *   part1 + part2 + part3
 *       ↓
 *   giant Blob
 *       ↓
 *   giant ArrayBuffer
 *
 * Instead only one part is held in JavaScript memory at a time.
 */
async function buildMainPak() {

    statusText.textContent =
        "Preparing main.pak...";

    /*
     * Create the output file.
     */
    let stream;

    try {
        Module.FS.unlink("/main.pak");
    } catch (e) {
        /* File doesn't exist yet. */
    }

    stream = Module.FS.open(
        "/main.pak",
        "w+"
    );

    let position = 0;

    try {

        const parts = [
            "main.pak.part1",
            "main.pak.part2",
            "main.pak.part3"
        ];

        for (let i = 0; i < parts.length; i++) {

            const filename = parts[i];

            const bytes =
                await fetchPart(filename, i + 1);

            statusText.textContent =
                "Combining " +
                filename +
                "...";

            /*
             * Write this piece immediately at the end of
             * the previous piece.
             */
            Module.FS.write(
                stream,
                bytes,
                0,
                bytes.length,
                position
            );

            position += bytes.length;

            /*
             * Release the JavaScript reference before the
             * next part is downloaded.
             */
            console.log(
                filename +
                " written: " +
                bytes.length +
                " bytes"
            );
        }

    } finally {
        Module.FS.close(stream);
    }

    console.log(
        "main.pak created: " +
        position +
        " bytes"
    );

    statusText.textContent =
        "main.pak ready (" +
        (position / 1048576).toFixed(1) +
        " MB)";
}


/*
 * Load the properties folder.
 */
async function loadProperties() {

    const files = [
        "properties/Layout.xml",
        "properties/default.xml",
        "properties/partner.xml",
        "properties/partner.xml.sig",
        "properties/partner_logo.jpg"
    ];

    mkdirSafe("/properties");

    for (const file of files) {

        statusText.textContent =
            "Loading " + file + "...";

        const url =
            "https://raw.githubusercontent.com/" +
            "AMoldyWaffle/PS2-HTML-ORYX/main/PvZ/" +
            file;

        const response =
            await fetch(url, {
                cache: "no-cache"
            });

        if (!response.ok) {
            throw new Error(
                file +
                " failed to download (HTTP " +
                response.status +
                ")."
            );
        }

        const bytes =
            new Uint8Array(
                await response.arrayBuffer()
            );

        Module.FS.writeFile(
            "/" + file,
            bytes
        );

        console.log(
            file +
            " loaded: " +
            bytes.length +
            " bytes"
        );
    }
}


/*
 * Persistent save filesystem.
 */
async function setupSaves() {

    statusText.textContent =
        "Setting up saves...";

    mkdirSafe("/saves");

    /*
     * CoreOmega's compatibility layer supplies a minimal temporary
     * IndexedDB implementation. Emscripten's IDBFS requires the full
     * IndexedDB API (including object-store indexes), so mounting IDBFS
     * inside that compatibility iframe can fail with:
     *     store.index is not a function
     *
     * The manual Save/Load buttons in this launcher export/import the
     * game's changed files directly, so IDBFS is optional here.
     */
    /*
     * CoreOmega runs this page in a compatibility iframe where IndexedDB
     * may be unavailable or intentionally emulated. Do not mount IDBFS here.
     * The launcher already provides manual Save/Load export/import below.
     *
     * Keeping the virtual /saves directory is fine; we simply don't connect
     * it to browser IndexedDB.
     */
    const fakeIndexedDB = true;

    if (fakeIndexedDB) {
        console.warn(
            "CoreOmega temporary IndexedDB detected; " +
            "skipping IDBFS and using manual Save/Load export instead."
        );
        statusText.textContent =
            "Manual Save/Load mode ready...";
        return;
    }

    try {

        Module.FS.mount(
            Module.FS.filesystems.IDBFS,
            {},
            "/saves"
        );

    } catch (e) {

        /*
         * If the filesystem is already mounted, don't
         * treat it as fatal.
         */
        console.log(
            "Save filesystem already mounted:",
            e
        );
    }

    await new Promise((resolve) => {

        Module.FS.syncfs(
            true,
            function(error) {

                if (error) {
                    console.warn(
                        "Initial save sync failed:",
                        error
                    );
                }

                resolve();
            }
        );

    });
}


/*
 * Keep saves synchronized periodically.
 */
function setupSaveSync() {

    const sync = function() {

        if (
            Module &&
            Module.FS &&
            Module.FS.syncfs &&
            !(
                window.indexedDB &&
                typeof window.indexedDB.open === "function" &&
                typeof window.indexedDB.databases !== "function" &&
                typeof window.indexedDB.cmp === "function"
            )
        ) {

            Module.FS.syncfs(
                false,
                function(error) {

                    if (error) {
                        console.warn(
                            "Save sync failed:",
                            error
                        );
                    }

                }
            );
        }
    };

    setInterval(sync, 5000);

    window.addEventListener(
        "pagehide",
        sync
    );

    window.addEventListener(
        "visibilitychange",
        function() {

            if (document.hidden)
                sync();

        }
    );
}


/*
 * Keep the original 800x600 PvZ aspect ratio.
 */
function resizeCanvas() {

    const scale =
        Math.min(
            window.innerWidth / 800,
            window.innerHeight / 600
        );

    canvas.style.width =
        Math.floor(800 * scale) + "px";

    canvas.style.height =
        Math.floor(600 * scale) + "px";
}

window.addEventListener(
    "resize",
    resizeCanvas
);

document.addEventListener(
    "fullscreenchange",
    resizeCanvas
);


/*
 * Fullscreen button.
 */
document.getElementById("fs").onclick =
    async function() {

        try {

            if (document.fullscreenElement) {

                await document.exitFullscreen();

            } else {

                await document.documentElement.requestFullscreen();

            }

        } catch (error) {

            console.warn(
                "Fullscreen failed:",
                error
            );
        }

        resizeCanvas();
    };


/*
 * Manual PC save/load support.
 *
 * Important: this launcher does not assume that the game actually writes
 * its save into /saves. Some native ports write their save files somewhere
 * else in Emscripten's virtual filesystem.
 *
 * Therefore we track files written after the game starts and export those
 * files, while also including everything in the persistent /saves mount.
 * This avoids exporting the very large immutable main.pak game data.
 */
const changedSaveFiles = new Set();

function normalizeSavePath(path) {
    if (typeof path !== "string")
        return null;

    if (!path.startsWith("/"))
        path = "/" + path;

    return path.replace(/\/+/g, "/");
}

function rememberSavePath(path) {
    path = normalizeSavePath(path);

    if (!path)
        return;

    // Never include the downloaded game assets in a save file.
    if (
        path === "/main.pak" ||
        path.startsWith("/properties/")
    ) {
        return;
    }

    changedSaveFiles.add(path);
}

function installSaveWriteTracker() {
    const FS = Module.FS;

    if (FS.__pvzSaveTrackerInstalled)
        return;

    FS.__pvzSaveTrackerInstalled = true;

    const originalWriteFile = FS.writeFile.bind(FS);
    FS.writeFile = function(path) {
        rememberSavePath(path);
        return originalWriteFile.apply(FS, arguments);
    };

    const originalOpen = FS.open.bind(FS);
    FS.open = function(path, flags) {
        const result = originalOpen.apply(FS, arguments);

        if (
            typeof flags === "string" &&
            /[wa+]/.test(flags)
        ) {
            rememberSavePath(path);
        }

        return result;
    };

    console.log("PvZ save-file tracker installed.");
}

function isDirectory(path) {
    return Module.FS.isDir(Module.FS.stat(path).mode);
}

function addDirectoryFiles(path, output) {
    let names;

    try {
        names = Module.FS.readdir(path);
    } catch (e) {
        return;
    }

    for (const name of names) {
        if (name === "." || name === "..")
            continue;

        const full = path === "/" ? "/" + name : path + "/" + name;

        if (
            full === "/main.pak" ||
            full.startsWith("/properties/")
        ) {
            continue;
        }

        try {
            if (isDirectory(full)) {
                addDirectoryFiles(full, output);
            } else {
                output[full] =
                    Array.from(Module.FS.readFile(full));
            }
        } catch (e) {
            console.warn("Could not include save file:", full, e);
        }
    }
}

async function syncSaveFilesystem(populate) {
    /*
     * PvZ is intentionally using manual file export/import in CoreOmega.
     * Do not call Emscripten syncfs here because that would attempt to use
     * IndexedDB/IDBFS in the compatibility context.
     */
    return;
}

async function exportSaveGame() {
    const button = document.getElementById("saveGame");
    button.disabled = true;
    button.textContent = "Saving...";

    try {
        // First flush the existing persistent mount.
        await syncSaveFilesystem(false);

        const files = {};

        // Always include /saves if the game uses the intended persistent mount.
        addDirectoryFiles("/saves", files);

        // Include files the game created/modified elsewhere.
        for (const path of changedSaveFiles) {
            try {
                if (!isDirectory(path)) {
                    files[path] =
                        Array.from(Module.FS.readFile(path));
                }
            } catch (e) {
                console.warn("Tracked save file no longer exists:", path);
            }
        }

        const fileCount = Object.keys(files).length;

        const save = {
            format: "pvz-web-save",
            version: 2,
            created: new Date().toISOString(),
            fileCount: fileCount,
            files: files
        };

        const blob = new Blob(
            [JSON.stringify(save)],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download =
            "plants-vs-zombies-save-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".pvzsave";

        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        alert(
            "Save exported successfully.\n\n" +
            "Save files included: " + fileCount + "\n" +
            "The .pvzsave file was downloaded to your computer."
        );
    } finally {
        button.disabled = false;
        button.textContent = "Save Game";
    }
}

function ensureDirectory(path) {
    const parts = path.split("/").filter(Boolean);
    let current = "";

    for (const part of parts) {
        current += "/" + part;

        try {
            Module.FS.mkdir(current);
        } catch (e) {
            // Already exists.
        }
    }
}

async function importSaveGame(file) {
    const loadButton = document.getElementById("loadGame");
    loadButton.disabled = true;
    loadButton.textContent = "Loading...";

    try {
        const save = JSON.parse(await file.text());

        if (
            !save ||
            save.format !== "pvz-web-save" ||
            !save.files ||
            typeof save.files !== "object"
        ) {
            throw new Error(
                "This is not a valid PvZ save file."
            );
        }

        let loaded = 0;

        for (const [path, data] of Object.entries(save.files)) {
            if (
                typeof path !== "string" ||
                !Array.isArray(data) ||
                path === "/main.pak" ||
                path.startsWith("/properties/")
            ) {
                continue;
            }

            const parent =
                path.substring(0, path.lastIndexOf("/")) || "/";

            ensureDirectory(parent);

            Module.FS.writeFile(
                path,
                new Uint8Array(data)
            );

            rememberSavePath(path);
            loaded++;
        }

        await syncSaveFilesystem(false);

        alert(
            "Save loaded successfully.\n\n" +
            "Files restored: " + loaded + "\n\n" +
            "The game will now reload so it can read the restored save."
        );

        location.reload();
    } finally {
        loadButton.disabled = false;
        loadButton.textContent = "Load Game";
    }
}

document.getElementById("saveGame").onclick = async function() {
    try {
        await exportSaveGame();
    } catch (error) {
        console.error("Save export failed:", error);
        alert(
            "Could not save the game:\n" +
            (error.message || error)
        );
    }
};

document.getElementById("loadGame").onclick = function() {
    document.getElementById("loadFile").click();
};

document.getElementById("loadFile").onchange =
async function(event) {
    const file = event.target.files && event.target.files[0];

    if (!file)
        return;

    try {
        await importSaveGame(file);
    } catch (error) {
        console.error("Save import failed:", error);
        alert(
            "Could not load the save:\n" +
            (error.message || error)
        );
    }

    event.target.value = "";
};


/*
 * Main startup sequence.
 */
(async function() {

    try {

        resizeCanvas();

        loadingText.textContent =
            "Loading game engine...";

        progress.value = 0;

        /*
         * Start loading pvz.js.
         */
        await loadPvzJS();

        /*
         * Wait until the WebAssembly runtime is initialized.
         */
        statusText.textContent =
            "Loading pvz.wasm...";

        await window.moduleReadyPromise;

        console.log(
            "WebAssembly runtime ready."
        );

        /*
         * Build the virtual main.pak.
         */
        loadingText.textContent =
            "Loading game data...";

        await buildMainPak();

        /*
         * Load properties/.
         */
        await loadProperties();

        /*
         * Set up persistent saves.
         */
        await setupSaves();

        setupSaveSync();

        /*
         * Track save files from this point onward, after the game's
         * downloaded assets have already been created.
         */
        installSaveWriteTracker();

        progress.value = 100;

        statusText.textContent =
            "Starting Plants vs. Zombies...";

        /*
         * Give the browser a frame to finish displaying
         * the loading screen before entering main().
         */
        await new Promise(
            requestAnimationFrame
        );

        loading.remove();

        canvas.focus();

        /*
         * Finally start the native game's main().
         */
        Module.callMain([]);

    } catch (error) {

        console.error(
            "PvZ startup failed:",
            error
        );

        loadingText.textContent =
            "Failed to load Plants vs. Zombies";

        statusText.textContent =
            error &&
            error.message
                ? error.message
                : String(error);

        progress.remove();
    }

})();
</script>

</body>
</html>
